<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif"><rect width="1160" height="720" fill="#0d1117"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker></defs><rect x="0" y="0" width="1160" height="62" fill="#1f6feb"/><path d="M26 12 l17 6 v13 c0 10 -7 17 -17 22 c-10 -5 -17 -12 -17 -22 v-13 z" fill="#fff" opacity=".95"/><path d="M19 30 l6 6 l11 -12" stroke="#1f6feb" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="27" font-size="17" font-weight="bold" fill="#fff">Two ACS data planes, two endpoints</text><text x="56" y="47" font-size="11.5" fill="#cfe1ff">Why an empty alert list tells you nothing about your CVE exposure</text><rect x="430" y="86" width="300" height="58" rx="9" fill="#1f6feb" opacity=".18" stroke="#58a6ff"/><text x="580" y="110" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="middle">ACS Central</text><text x="580" y="130" font-size="10.5" fill="#8b949e" text-anchor="middle">one product, two completely separate stores</text><line x1="500" y1="144" x2="330" y2="186" stroke="#58a6ff" stroke-width="2" marker-end="url(#ah)"/><line x1="660" y1="144" x2="830" y2="186" stroke="#58a6ff" stroke-width="2" marker-end="url(#ah)"/><rect x="24" y="190" width="500" height="300" rx="10" fill="#1c2330" stroke="#30363d"/><rect x="24" y="190" width="500" height="4" rx="2" fill="#58a6ff"/><text x="42" y="220" font-size="14" font-weight="bold" fill="#e6edf3">1. Policy violations</text><text x="42" y="240" font-size="10.5" fill="#8b949e">A rule you or Red Hat wrote, and something broke it</text><rect x="42" y="252" width="464" height="26" rx="5" fill="#161b22" stroke="#30363d"/><text x="52" y="269" font-size="11" fill="#58a6ff" font-family="monospace">GET /v1/alerts</text><text x="42" y="300" font-size="10.5" fill="#e6edf3" font-family="monospace">ListAlert {</text><text x="42" y="317" font-size="10.5" fill="#e6edf3" font-family="monospace">  policy.name, policy.severity, policy.categories</text><text x="42" y="334" font-size="10.5" fill="#e6edf3" font-family="monospace">  lifecycleStage, state</text><text x="42" y="351" font-size="10.5" fill="#e6edf3" font-family="monospace">  commonEntityInfo.namespace   &lt;-- not deployment.namespace</text><text x="42" y="368" font-size="10.5" fill="#e6edf3" font-family="monospace">  NO violations[]              &lt;-- the detail is not here</text><text x="42" y="385" font-size="10.5" fill="#e6edf3" font-family="monospace">}</text><rect x="42" y="406" width="464" height="68" rx="6" fill="#161b22" stroke="#30363d"/><text x="52" y="426" font-size="10.5" fill="#8b949e">The slim projection. It tells you WHICH policy fired and</text><text x="52" y="441" font-size="10.5" fill="#8b949e">where, but never WHY.</text><text x="52" y="456" font-size="10.5" fill="#8b949e">For the violation text you must then call</text><text x="52" y="471" font-size="10.5" fill="#8b949e">GET /v1/alerts/{id} per alert. This tool does that for you.</text><rect x="636" y="190" width="500" height="300" rx="10" fill="#1c2330" stroke="#30363d"/><rect x="636" y="190" width="500" height="4" rx="2" fill="#3fb950"/><text x="654" y="220" font-size="14" font-weight="bold" fill="#e6edf3">2. Image vulnerabilities</text><text x="654" y="240" font-size="10.5" fill="#8b949e">A CVE the scanner found in a package inside an image</text><rect x="654" y="252" width="464" height="26" rx="5" fill="#161b22" stroke="#30363d"/><text x="664" y="269" font-size="11" fill="#58a6ff" font-family="monospace">GET /v1/export/vuln-mgmt/workloads</text><text x="654" y="300" font-size="10.5" fill="#e6edf3" font-family="monospace">NDJSON, one line per workload:</text><text x="654" y="317" font-size="10.5" fill="#e6edf3" font-family="monospace">{"result": {</text><text x="654" y="334" font-size="10.5" fill="#e6edf3" font-family="monospace">  "deployment": {...}, "livePods": N,</text><text x="654" y="351" font-size="10.5" fill="#e6edf3" font-family="monospace">  "images": [{ scan.components[].vulns[] }]</text><text x="654" y="368" font-size="10.5" fill="#e6edf3" font-family="monospace">}}</text><rect x="654" y="389" width="464" height="85" rx="6" fill="#161b22" stroke="#30363d"/><text x="664" y="409" font-size="10.5" fill="#8b949e">Streams, so res.json() fails on it. Read as text.</text><text x="664" y="424" font-size="10.5" fill="#8b949e">Token needs read on Image AND Deployment. A token</text><text x="664" y="439" font-size="10.5" fill="#8b949e">scoped only to Alert gets 403 here while /v1/alerts</text><text x="664" y="454" font-size="10.5" fill="#8b949e">keeps working, which is a confusing way to see nothing.</text><rect x="24" y="506" width="1112" height="86" rx="9" fill="#2d0f10" stroke="#f85149"/><text x="44" y="532" font-size="13" font-weight="bold" fill="#ffb3ad">The trap</text><text x="44" y="553" font-size="11.5" fill="#f5c6c2">An image CVE is NOT a policy violation. It only produces an alert if somebody wrote a policy that fires on it, and most teams have not.</text><text x="44" y="571" font-size="11.5" fill="#f5c6c2">So a cluster full of critical, actively exploited CVEs can return an empty /v1/alerts list. Empty is not clean. It is the wrong question.</text><line x1="274" y1="490" x2="274" y2="506" stroke="#f85149" stroke-width="2" marker-end="url(#ar)"/><line x1="886" y1="490" x2="886" y2="506" stroke="#f85149" stroke-width="2" marker-end="url(#ar)"/><rect x="24" y="608" width="546" height="92" rx="9" fill="#161b22" stroke="#30363d"/><rect x="24" y="608" width="4" height="92" rx="2" fill="#58a6ff"/><text x="44" y="632" font-size="12.5" font-weight="bold" fill="#e6edf3">What the tool does with violations</text><text x="44" y="652" font-size="10.5" fill="#8b949e">Matches each one to a policy, then to the manifest line that</text><text x="44" y="668" font-size="10.5" fill="#8b949e">causes it. Auto fixes the safe ones as YAML text edits,</text><text x="44" y="684" font-size="10.5" fill="#8b949e">explains the rest. Never runs a command.</text><rect x="590" y="608" width="546" height="92" rx="9" fill="#161b22" stroke="#30363d"/><rect x="590" y="608" width="4" height="92" rx="2" fill="#3fb950"/><text x="610" y="632" font-size="12.5" font-weight="bold" fill="#e6edf3">What the tool does with CVEs</text><text x="610" y="652" font-size="10.5" fill="#8b949e">Ranks them, points at the file declaring the image, flags git</text><text x="610" y="668" font-size="10.5" fill="#8b949e">against cluster drift, and emits a rebuild worklist grouped by</text><text x="610" y="684" font-size="10.5" fill="#8b949e">image. No auto fix: ACS knows fixed packages, not fixed tags.</text></svg>