<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif"><rect width="1160" height="600" fill="#0d1117"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker></defs><rect x="0" y="0" width="1160" height="62" fill="#1f6feb"/><path d="M26 12 l17 6 v13 c0 10 -7 17 -17 22 c-10 -5 -17 -12 -17 -22 v-13 z" fill="#fff" opacity=".95"/><path d="M19 30 l6 6 l11 -12" stroke="#1f6feb" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="27" font-size="17" font-weight="bold" fill="#fff">Architecture</text><text x="56" y="47" font-size="11.5" fill="#cfe1ff">One engine. Every surface reads it. Nothing duplicates policy logic.</text><rect x="310" y="84" width="540" height="62" rx="8" fill="#161b22" stroke="#30363d"/><rect x="310" y="84" width="4" height="62" rx="2" fill="#3fb950"/><text x="326" y="106" font-size="12.5" font-weight="bold" fill="#e6edf3">acs_policies.js   THE ENGINE</text><text x="326" y="125" font-size="10.5" fill="#8b949e" font-family="monospace">ACS.001 to ACS.020  |  checks, fixes, ACS import and matching, CVE model,</text><text x="326" y="140" font-size="10.5" fill="#8b949e" font-family="monospace">violation fix routing, patch drafting, diff, citations, weights</text><line x1="580" y1="148" x2="170" y2="196" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/><line x1="580" y1="148" x2="470" y2="196" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/><line x1="580" y1="148" x2="770" y2="196" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/><line x1="580" y1="148" x2="1010" y2="196" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/><rect x="24" y="196" width="230" height="110" rx="8" fill="#161b22" stroke="#30363d"/><rect x="24" y="196" width="4" height="110" rx="2" fill="#58a6ff"/><text x="40" y="218" font-size="12.5" font-weight="bold" fill="#e6edf3">dj_acs_auditor.html  Audit tab</text><text x="40" y="237" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Read only. Scan, score,</text><text x="40" y="252" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">cross check, violations,</text><text x="40" y="267" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">CVEs, export the report</text><rect x="318" y="196" width="230" height="110" rx="8" fill="#161b22" stroke="#30363d"/><rect x="318" y="196" width="4" height="110" rx="2" fill="#58a6ff"/><text x="334" y="218" font-size="12.5" font-weight="bold" fill="#e6edf3">dj_acs_auditor.html  Remediate tab</text><text x="334" y="237" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Same file. Preview, confirm,</text><text x="334" y="252" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">step through, undo. Produces</text><text x="334" y="267" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">YAML you download</text><rect x="612" y="196" width="230" height="110" rx="8" fill="#161b22" stroke="#30363d"/><rect x="612" y="196" width="4" height="110" rx="2" fill="#58a6ff"/><text x="628" y="218" font-size="12.5" font-weight="bold" fill="#e6edf3">acs_cli.js</text><text x="628" y="237" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Headless. Same output,</text><text x="628" y="252" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">for a pipeline. acs.sh,</text><text x="628" y="267" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">acs.ps1, acs.cmd wrap it</text><rect x="906" y="196" width="230" height="110" rx="8" fill="#161b22" stroke="#30363d"/><rect x="906" y="196" width="4" height="110" rx="2" fill="#a371f7"/><text x="922" y="218" font-size="12.5" font-weight="bold" fill="#e6edf3">test/*.cjs</text><text x="922" y="237" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">786 assertions against</text><text x="922" y="252" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">the same engine every</text><text x="922" y="267" font-size="10.5" fill="#8b949e" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">surface loads</text><rect x="24" y="330" width="1112" height="112" rx="10" fill="#1c2330" stroke="#30363d"/><text x="44" y="356" font-size="11" font-weight="bold" fill="#58a6ff">WHERE THE CLUSTER IS ACTUALLY CONTACTED</text><text x="44" y="380" font-size="11" fill="#e6edf3">Nowhere above. The pages contain no network call at all, and the CLI reads files.</text><text x="44" y="400" font-size="11" fill="#8b949e">scripts/acs_pull_all.sh and its PowerShell, SSH and oc port forward variants issue every request, GET only, in a shell where</text><text x="44" y="418" font-size="11" fill="#8b949e">the token can be kept out of ps and out of history. Their output is dropped onto a page or passed to the CLI with --alerts.</text><text x="24" y="470" font-size="10.5" fill="#8b949e">vendor/  js-yaml 4.1.0 and JSZip 3.10.1, committed and verified by SHA-256. No package manager, no network, works air gapped.</text><rect x="24" y="490" width="1112" height="86" rx="10" fill="#1c2330" stroke="#30363d"/><rect x="24" y="490" width="3" height="86" fill="#3fb950"/><text x="44" y="516" font-size="12" font-weight="bold" fill="#e6edf3">The rule this diagram exists to enforce</text><text x="44" y="538" font-size="11" fill="#8b949e">Never copy a check into a second file to make a surface work. If a surface cannot reach the engine, fix the loading, not the logic.</text><text x="44" y="558" font-size="11" fill="#8b949e">The failure this prevents: the page reports a finding, the pipeline does not, and nobody notices for months.</text></svg>