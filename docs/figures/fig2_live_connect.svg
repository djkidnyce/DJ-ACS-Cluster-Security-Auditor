<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<rect width="1160" height="600" fill="#0d1117"/>
<rect x="0" y="0" width="1160" height="62" fill="#1f6feb"/><path d="M26 12 l17 6 v13 c0 10 -7 17 -17 22 c-10 -5 -17 -12 -17 -22 v-13 z" fill="#fff" opacity=".95"/><path d="M19 30 l6 6 l11 -12" stroke="#1f6feb" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="27" font-size="17" font-weight="bold" fill="#fff">Connecting to a live cluster</text><text x="56" y="47" font-size="11.5" fill="#cfe1ff">Pull violations from ACS Central, or pull the running workloads from the OpenShift API</text>
<rect x="24" y="80" width="1112" height="300" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="42" y="103" font-size="11" font-weight="bold" fill="#58a6ff">OR PULL STRAIGHT FROM YOUR CLUSTER</text>
<rect x="42" y="115" width="104" height="24" rx="6" fill="#1c2330" stroke="#58a6ff"/>
<text x="94.0" y="131" font-size="11" fill="#58a6ff" font-weight="bold" text-anchor="middle">ACS Central</text>
<rect x="160" y="115" width="104" height="24" rx="6" fill="#1c2330" stroke="#30363d"/>
<text x="212.0" y="131" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="middle">OpenShift API</text>
<text x="42" y="167" font-size="8.5" fill="#8b949e">ACS CENTRAL URL</text>
<rect x="42" y="174" width="336" height="28" rx="6" fill="#1c2330" stroke="#30363d"/>
<text x="52" y="193" font-size="10.5" fill="#e6edf3">https://central-stackrox.apps.example.com</text>
<text x="412" y="167" font-size="8.5" fill="#8b949e">API TOKEN</text>
<rect x="412" y="174" width="336" height="28" rx="6" fill="#1c2330" stroke="#30363d"/>
<text x="422" y="193" font-size="10.5" fill="#e6edf3">••••••••••••••••••••••••</text>
<text x="782" y="167" font-size="8.5" fill="#8b949e">FILTER (OPTIONAL ACS QUERY)</text>
<rect x="782" y="174" width="336" height="28" rx="6" fill="#1c2330" stroke="#30363d"/>
<text x="792" y="193" font-size="10.5" fill="#e6edf3">Severity:CRITICAL_SEVERITY</text>
<rect x="42" y="216" width="126" height="26" rx="6" fill="#1f6feb"/>
<text x="105" y="233" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Fetch violations</text>
<rect x="122" y="216" width="228" height="26" rx="6" fill="#1c2330" stroke="#30363d"/>
<text x="290" y="233" font-size="11" fill="#e6edf3" text-anchor="middle">Show the offline command instead</text>
<circle cx="430" cy="229" r="11" fill="#58a6ff"/><text x="430" y="233" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="448" y="233" font-size="11.5" fill="#e6edf3">Use this when the browser is blocked</text>
<rect x="42" y="258" width="1076" height="72" rx="7" fill="#1c2330"/>
<rect x="42" y="258" width="3" height="72" fill="#d4a72c"/>
<text x="58" y="278" font-size="11" font-weight="bold" fill="#e6edf3">How your token is handled.</text>
<text x="58" y="296" font-size="10.5" fill="#8b949e">It stays in a variable in this tab for the duration of the request, then the field is cleared.</text>
<text x="58" y="311" font-size="10.5" fill="#8b949e">It is never written to storage, never logged, and never included in any file you download.</text>
<text x="58" y="326" font-size="10.5" fill="#8b949e">Use a short lived, read only, least privileged token regardless.</text>
<circle cx="40" cy="352" r="11" fill="#58a6ff"/><text x="40" y="356" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="58" y="356" font-size="11.5" fill="#e6edf3">Read only. Nothing is ever written back to the cluster</text>
<rect x="24" y="398" width="1112" height="186" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="42" y="421" font-size="11" font-weight="bold" fill="#58a6ff">IF THE BROWSER BLOCKS THE CALL</text>
<text x="42" y="443" font-size="11" fill="#e6edf3">A page opened from a file:// URL has a null origin. Neither ACS Central nor the OpenShift API sends a CORS header that allows it,</text>
<text x="42" y="460" font-size="11" fill="#e6edf3">so the browser blocks the response before the page sees it. That is the browser protecting you, not a defect. Two ways forward:</text>
<text x="52" y="486" font-size="11" fill="#3fb950">A.  Serve the page from an allowed origin</text>
<text x="70" y="503" font-size="10.5" fill="#8b949e">OpenShift: add it to spec.additionalCORSAllowedOrigins on the APIServer resource.</text>
<text x="70" y="519" font-size="10.5" fill="#8b949e">ACS: serve the page from Central's own route, or put both behind one reverse proxy.</text>
<text x="52" y="543" font-size="11" fill="#3fb950">B.  Use the offline route, which never involves the browser</text>
<rect x="70" y="551" width="1000" height="22" rx="5" fill="#1c2330" stroke="#30363d"/>
<text x="80" y="566" font-size="10" font-family="monospace" fill="#e6edf3">curl -sk -H "Authorization: Bearer $ROX_API_TOKEN" "https://central.../v1/alerts" -o acs_alerts.json   # then drop the file on the page</text>
</svg>