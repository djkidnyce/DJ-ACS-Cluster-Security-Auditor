<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="512" viewBox="0 0 1160 512" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<rect width="1160" height="512" fill="#0d1117"/>
<rect x="0" y="0" width="1160" height="62" fill="#1f6feb"/><path d="M26 12 l17 6 v13 c0 10 -7 17 -17 22 c-10 -5 -17 -12 -17 -22 v-13 z" fill="#fff" opacity=".95"/><path d="M19 30 l6 6 l11 -12" stroke="#1f6feb" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="27" font-size="17" font-weight="bold" fill="#fff">What comes out</text><text x="56" y="47" font-size="11.5" fill="#cfe1ff">Five ways to take the result. All of them are files you review, none of them run anything</text>
<rect x="32" y="92" width="212" height="132" rx="9" fill="#161b22" stroke="#1f6feb"/>
<text x="48" y="120" font-size="12.5" font-weight="bold" fill="#e6edf3">Patched YAML, ZIP</text>
<text x="48" y="144" font-size="10.5" fill="#8b949e">Your folder structure preserved,</text>
<text x="48" y="160" font-size="10.5" fill="#8b949e">plus a change log</text>
<rect x="256" y="92" width="212" height="132" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="272" y="120" font-size="12.5" font-weight="bold" fill="#e6edf3">One combined YAML</text>
<text x="272" y="144" font-size="10.5" fill="#8b949e">Every document in a single file</text>
<rect x="480" y="92" width="212" height="132" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="496" y="120" font-size="12.5" font-weight="bold" fill="#e6edf3">Merge patches</text>
<text x="496" y="144" font-size="10.5" fill="#8b949e">Only the changed fields, keyed</text>
<text x="496" y="160" font-size="10.5" fill="#8b949e">on container name. For Helm</text>
<text x="496" y="176" font-size="10.5" fill="#8b949e">and Kustomize templates</text>
<rect x="704" y="92" width="212" height="132" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="720" y="120" font-size="12.5" font-weight="bold" fill="#e6edf3">Full diff</text>
<text x="720" y="144" font-size="10.5" fill="#8b949e">Copied to the clipboard for a</text>
<text x="720" y="160" font-size="10.5" fill="#8b949e">ticket or a review</text>
<rect x="928" y="92" width="212" height="132" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="944" y="120" font-size="12.5" font-weight="bold" fill="#e6edf3">Change log</text>
<text x="944" y="144" font-size="10.5" fill="#8b949e">Every change, why, and the</text>
<text x="944" y="160" font-size="10.5" fill="#8b949e">standards behind it</text>
<rect x="32" y="248" width="1096" height="132" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="52" y="272" font-size="11" font-weight="bold" fill="#58a6ff">EXAMPLE MERGE PATCH</text>
<text x="52" y="290" font-size="10" font-family="monospace" xml:space="preserve" fill="#e6edf3">spec:</text>
<text x="52" y="305" font-size="10" font-family="monospace" xml:space="preserve" fill="#e6edf3">&#160;&#160;template:</text>
<text x="52" y="320" font-size="10" font-family="monospace" xml:space="preserve" fill="#e6edf3">&#160;&#160;&#160;&#160;spec:</text>
<text x="52" y="335" font-size="10" font-family="monospace" xml:space="preserve" fill="#e6edf3">&#160;&#160;&#160;&#160;&#160;&#160;containers:</text>
<text x="52" y="350" font-size="10" font-family="monospace" xml:space="preserve" fill="#3fb950">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;-&#160;securityContext:</text>
<text x="52" y="365" font-size="10" font-family="monospace" xml:space="preserve" fill="#3fb950">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;privileged:&#160;false</text>
<text x="52" y="380" font-size="10" font-family="monospace" xml:space="preserve" fill="#3fb950">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;name:&#160;api</text>
<text x="560" y="292" font-size="10.5" fill="#8b949e">Only the field that changed, plus the container name.</text>
<text x="560" y="308" font-size="10.5" fill="#8b949e">Kubernetes merges these arrays on name, so this patch</text>
<text x="560" y="324" font-size="10.5" fill="#8b949e">cannot clobber a field that drifted since the scan.</text>
<rect x="32" y="398" width="1096" height="88" rx="9" fill="#1c2330"/>
<rect x="32" y="398" width="3" height="88" fill="#3fb950"/>
<text x="52" y="422" font-size="12" font-weight="bold" fill="#e6edf3">No command is ever run to remediate a finding.</text>
<text x="52" y="442" font-size="10.5" fill="#8b949e">Fixes are edits to YAML text made in your browser. Nothing calls oc, kubectl or roxctl. Nothing is applied to a cluster.</text>
<text x="52" y="457" font-size="10.5" fill="#8b949e">The tool contains no exec, no eval and no Function constructor, and the test suite asserts that.</text>
<text x="52" y="472" font-size="10.5" fill="#8b949e">You review the output and deploy it through whatever process you already trust.</text>
</svg>