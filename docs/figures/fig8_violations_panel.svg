<path d="M45 183 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="70" y="176" width="67.2" height="15" rx="7" fill="#67060c"/><text x="103.6" y="187" font-size="8.5" font-weight="bold" fill="#ffb3ad" text-anchor="middle">CRITICAL</text>
<text x="160" y="187" font-size="10.5" font-family="monospace" fill="#58a6ff" font-weight="bold">ACS.001</text>
<text x="216" y="187" font-size="10.5" fill="#e6edf3">Privileged Container</text>
<text x="396" y="187" font-size="10.5" fill="#e6edf3">Deployment/payments-api</text>
<text x="620" y="187" font-size="10.5" fill="#8b949e">prod</text>
<text x="744" y="187" font-size="10.5" fill="#8b949e">ACTIVE</text>
<text x="820" y="187" font-size="9.5" fill="#8b949e">Container "api" is privileged</text>
<rect x="1020" y="176" width="92.4" height="15" rx="7" fill="none" stroke="#3fb950"/>
<text x="1066.2" y="187" font-size="9" fill="#3fb950" text-anchor="middle">In your YAML</text>
<line x1="42" y1="200" x2="1118" y2="200" stroke="#30363d"/>
<rect x="42" y="215" width="13" height="13" rx="3" fill="#58a6ff" stroke="#58a6ff"/>
<path d="M45 221 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="70" y="214" width="41.6" height="15" rx="7" fill="#5a2d0c"/><text x="90.8" y="225" font-size="8.5" font-weight="bold" fill="#ffc999" text-anchor="middle">HIGH</text>
<text x="160" y="225" font-size="10.5" font-family="monospace" fill="#58a6ff" font-weight="bold">ACS.004</text>
<text x="216" y="225" font-size="10.5" fill="#e6edf3">Host Network</text>
<text x="396" y="225" font-size="10.5" fill="#e6edf3">Deployment/edge-proxy</text>
<text x="620" y="225" font-size="10.5" fill="#8b949e">prod</text>
<text x="744" y="225" font-size="10.5" fill="#8b949e">ACTIVE</text>
<text x="820" y="225" font-size="9.5" fill="#8b949e">Deployment uses the host network</text>
<rect x="1020" y="214" width="49.0" height="15" rx="7" fill="none" stroke="#58a6ff"/>
<text x="1044.5" y="225" font-size="9" fill="#58a6ff" text-anchor="middle">Patch</text>
<line x1="42" y1="238" x2="1118" y2="238" stroke="#30363d"/>
<rect x="42" y="253" width="13" height="13" rx="3" fill="#1c2330" stroke="#30363d"/>
<rect x="70" y="252" width="41.6" height="15" rx="7" fill="#5a2d0c"/><text x="90.8" y="263" font-size="8.5" font-weight="bold" fill="#ffc999" text-anchor="middle">HIGH</text>
<text x="160" y="263" font-size="10.5" font-family="monospace" fill="#58a6ff" font-weight="bold">ACS.007</text>
<text x="216" y="263" font-size="10.5" fill="#e6edf3">Root User</text>
<text x="396" y="263" font-size="10.5" fill="#e6edf3">StatefulSet/cache</text>
<text x="620" y="263" font-size="10.5" fill="#8b949e">data</text>
<text x="744" y="263" font-size="10.5" fill="#8b949e">ACTIVE</text>
<text x="820" y="263" font-size="9.5" fill="#8b949e">Container runs as root</text>
<rect x="1020" y="252" width="49.0" height="15" rx="7" fill="none" stroke="#58a6ff"/>
<text x="1044.5" y="263" font-size="9" fill="#58a6ff" text-anchor="middle">Patch</text>
<line x1="42" y1="276" x2="1118" y2="276" stroke="#30363d"/>
<rect x="42" y="291" width="13" height="13" rx="3" fill="#1c2330" stroke="#30363d"/>
<rect x="70" y="290" width="54.400000000000006" height="15" rx="7" fill="#4d3800"/><text x="97.2" y="301" font-size="8.5" font-weight="bold" fill="#f2d24b" text-anchor="middle">MEDIUM</text>
<text x="160" y="301" font-size="10.5" font-family="monospace" fill="#58a6ff" font-weight="bold">ACS.012</text>
<text x="216" y="301" font-size="10.5" fill="#e6edf3">No Resource Limits</text>
<text x="396" y="301" font-size="10.5" fill="#e6edf3">CronJob/nightly-etl</text>
<text x="620" y="301" font-size="10.5" fill="#8b949e">batch</text>
<text x="744" y="301" font-size="10.5" fill="#8b949e">ACTIVE</text>
<text x="820" y="301" font-size="9.5" fill="#8b949e">No CPU or memory limit set</text>
<rect x="1020" y="290" width="98.60000000000001" height="15" rx="7" fill="none" stroke="#d4a72c"/>
<text x="1069.3" y="301" font-size="9" fill="#d4a72c" text-anchor="middle">Need manifest</text>
<line x1="42" y1="314" x2="1118" y2="314" stroke="#30363d"/>
<rect x="42" y="329" width="13" height="13" rx="3" fill="#0d1117" stroke="#30363d"/>
<line x1="44" y1="331" x2="53" y2="340" stroke="#30363d" stroke-width="1.2"/>
<rect x="70" y="328" width="41.6" height="15" rx="7" fill="#5a2d0c"/><text x="90.8" y="339" font-size="8.5" font-weight="bold" fill="#ffc999" text-anchor="middle">HIGH</text>
<text x="160" y="339" font-size="10.5" font-family="monospace" fill="#58a6ff" font-weight="bold">ACS.001</text>
<text x="216" y="339" font-size="10.5" fill="#e6edf3">Privileged Container</text>
<text x="396" y="339" font-size="10.5" fill="#e6edf3">DaemonSet/ovnkube-node</text>
<rect x="556" y="329" width="56" height="13" rx="6" fill="none" stroke="#30363d"/>
<text x="584" y="339" font-size="8" fill="#8b949e" text-anchor="middle">PLATFORM</text>
<text x="620" y="339" font-size="10.5" fill="#8b949e">openshift-ovn-kube</text>
<text x="744" y="339" font-size="10.5" fill="#8b949e">ACTIVE</text>
<text x="820" y="339" font-size="9.5" fill="#8b949e">Container "ovn-controller" is privileged</text>
<rect x="1020" y="328" width="67.6" height="15" rx="7" fill="none" stroke="#f85149"/>
<text x="1053.8" y="339" font-size="9" fill="#f85149" text-anchor="middle">Platform</text>
<line x1="42" y1="352" x2="1118" y2="352" stroke="#30363d"/>
<text x="42" y="392" font-size="10.5" fill="#8b949e">Click a row for the rationale, the standards it maps to, and the reasoning behind the fix route.</text>
<circle cx="53" cy="426" r="11" fill="#58a6ff"/><text x="53" y="430" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="71" y="430" font-size="11.5" fill="#e6edf3">Tick what you want to fix. Nothing is selected until you select it.</text>
<circle cx="53" cy="456" r="11" fill="#58a6ff"/><text x="53" y="460" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="71" y="460" font-size="11.5" fill="#e6edf3">No route means no checkbox you can tick. Hover it for the reason.</text>
<rect x="24" y="500" width="1112" height="152" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="42" y="524" font-size="11" font-weight="bold" fill="#58a6ff">WHAT EACH ROUTE MEANS</text>
<rect x="42" y="536" width="92.4" height="14" rx="7" fill="none" stroke="#3fb950"/>
<text x="88.2" y="546" font-size="8.5" fill="#3fb950" text-anchor="middle">In your YAML</text>
<text x="148.4" y="546" font-size="10.5" fill="#8b949e">The manifest is loaded, so the fix is applied to it directly and you download the corrected file.</text>
<rect x="42" y="553" width="49.0" height="14" rx="7" fill="none" stroke="#58a6ff"/>
<text x="66.5" y="563" font-size="8.5" fill="#58a6ff" text-anchor="middle">Patch</text>
<text x="105.0" y="563" font-size="10.5" fill="#8b949e">No manifest for this object, so a strategic merge patch is drafted from the violation itself.</text>
<rect x="42" y="570" width="98.60000000000001" height="14" rx="7" fill="none" stroke="#d4a72c"/>
<text x="91.30000000000001" y="580" font-size="8.5" fill="#d4a72c" text-anchor="middle">Need manifest</text>
<text x="154.60000000000002" y="580" font-size="10.5" fill="#8b949e">Fixable in principle, but the violation does not carry enough to draft a patch safely.</text>
<rect x="42" y="587" width="104.8" height="14" rx="7" fill="none" stroke="#d4a72c"/>
<text x="94.4" y="597" font-size="8.5" fill="#d4a72c" text-anchor="middle">Human decision</text>
<text x="160.8" y="597" font-size="10.5" fill="#8b949e">The policy has no mechanical fix. Somebody has to decide.</text>
<rect x="42" y="604" width="67.6" height="14" rx="7" fill="none" stroke="#f85149"/>
<text x="75.8" y="614" font-size="8.5" fill="#f85149" text-anchor="middle">Platform</text>
<text x="123.6" y="614" font-size="10.5" fill="#8b949e">A platform component. Listed, never patched: the owning operator reverts manual edits.</text>
<rect x="42" y="621" width="92.4" height="14" rx="7" fill="none" stroke="#d4a72c"/>
<text x="88.2" y="631" font-size="8.5" fill="#d4a72c" text-anchor="middle">Not modelled</text>
<text x="148.4" y="631" font-size="10.5" fill="#8b949e">No policy in the catalogue matches. Reported rather than dropped.</text>
<rect x="24" y="670" width="1112" height="100" rx="9" fill="#161b22" stroke="#30363d"/>
<rect x="24" y="670" width="3" height="100" fill="#3fb950"/>
<text x="44" y="694" font-size="12" font-weight="bold" fill="#e6edf3">What "fix" produces: a YAML file for the ones you ticked, and nothing else.</text>
<text x="44" y="716" font-size="10.5" fill="#8b949e">No command is run and no cluster is touched, on any surface, in any mode. Each drafted file names the object, the namespace and the policies</text>
<text x="44" y="733" font-size="10.5" fill="#8b949e">it covers, and states on its face that it was built from a violation rather than from a manifest and therefore needs verifying. Test it against a</text>
<text x="44" y="750" font-size="10.5" fill="#8b949e">namespace you do not care about, then apply it yourself. Report mode, the default, writes the written account and no YAML at all.</text>
<text x="44" y="767" font-size="10.5" fill="#8b949e">The report states how many of the imported violations were in scope, so a document covering a subset cannot be mistaken for one covering the cluster.</text>
</svg>