<path d="M421.49999999999994 123 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="439.49999999999994" y="127" font-size="10.5" fill="#8b949e">Matched to a policy</text>
<rect x="568.3999999999999" y="116" width="14" height="14" rx="3" fill="#1c2330" stroke="#30363d"/>
<text x="589.3999999999999" y="127" font-size="10.5" fill="#8b949e">Unmatched</text>
<text x="667.2999999999998" y="127" font-size="10.5" fill="#8b949e">showing 4 of 6 violation(s): 4 on your workloads, 2 on platform components</text>
<text x="42" y="156" font-size="9" fill="#8b949e" letter-spacing="1"></text>
<text x="70" y="156" font-size="9" fill="#8b949e" letter-spacing="1">SEVERITY</text>
<text x="160" y="156" font-size="9" fill="#8b949e" letter-spacing="1">ACS POLICY</text>
<text x="396" y="156" font-size="9" fill="#8b949e" letter-spacing="1">OBJECT</text>
<text x="620" y="156" font-size="9" fill="#8b949e" letter-spacing="1">NAMESPACE</text>
<text x="744" y="156" font-size="9" fill="#8b949e" letter-spacing="1">STATE</text>
<text x="820" y="156" font-size="9" fill="#8b949e" letter-spacing="1">VIOLATION</text>
<text x="1020" y="156" font-size="9" fill="#8b949e" letter-spacing="1">FIX</text>
<rect x="42" y="146" width="13" height="13" rx="3" fill="#1c2330" stroke="#58a6ff"/>
<line x1="45" y1="152" x2="52" y2="152" stroke="#58a6ff" stroke-width="2"/>
<line x1="42" y1="164" x2="1118" y2="164" stroke="#30363d"/>
