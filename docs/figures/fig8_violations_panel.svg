<text x="182.39999999999998" y="127" font-size="10.5" fill="#8b949e">Platform components</text>
<rect x="311.29999999999995" y="116" width="14" height="14" rx="3" fill="#1c2330" stroke="#30363d"/>
<text x="332.29999999999995" y="127" font-size="10.5" fill="#8b949e">Fixable only</text>
